name: Bootstrap explorer

on:
  push:
    paths:
      - '.bootstrap-ready'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand project
        shell: bash
        run: |
          set -euo pipefail

          cat .bootstrap/chunk-01.b64 \
              .bootstrap/chunk-02.b64 \
              .bootstrap/chunk-03.b64 \
              .bootstrap/chunk-04.b64 \
              .bootstrap/chunk-05.b64 \
              .bootstrap/chunk-06.b64 > /tmp/project.b64

          git show ffbf71bbbeb7f323b178405ccc948aef49248f49:.bootstrap/chunk-07.b64 \
            | tr -d '[:space:]' >> /tmp/project.b64

          base64 --decode /tmp/project.b64 > /tmp/project.zip

          # The payload is intact but the hand-transferred ZIP directory tail
          # contains a few bad bytes. Rebuild the central directory from the
          # local file records, then validate before extracting anything.
          zip -FF /tmp/project.zip --out /tmp/repaired.zip >/tmp/zip-repair.log 2>&1 || {
            cat /tmp/zip-repair.log
            exit 1
          }
          unzip -t /tmp/repaired.zip

          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -q /tmp/repaired.zip -d /tmp/project

          test -s /tmp/project/spectroscopy-photometric-redshift-explorer/index.html
          grep -q 'Spectroscopy & Photometric Redshift Explorer' \
            /tmp/project/spectroscopy-photometric-redshift-explorer/index.html

          rm -rf assets .bootstrap .bootstrap-ready
          rm -f .github/workflows/bootstrap.yml
          cp -a /tmp/project/spectroscopy-photometric-redshift-explorer/. .

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m 'Add Spectroscopy & Photometric Redshift Explorer'
            git push
          fi
